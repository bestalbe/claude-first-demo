<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 3rem;
      opacity: 0.7;
    }

    .countdown {
      display: flex;
      gap: 2.5rem;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .number {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 700;
      line-height: 1;
      min-width: 2ch;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .label {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .separator {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 700;
      line-height: 1;
      opacity: 0.3;
      align-self: flex-start;
      padding-top: 0;
    }

    .expired {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      opacity: 0.8;
    }

    .input-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .input-panel label {
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      opacity: 0.8;
    }

    .input-panel input {
      padding: 0.75rem 1rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      text-align: center;
      outline: none;
      font-family: inherit;
    }

    .input-panel input:focus {
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
    }

    .btn {
      padding: 0.75rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      transition: transform 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-reset {
      margin-top: 2rem;
      font-size: 0.8rem;
      padding: 0.5rem 1.5rem;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }

    .hidden {
      display: none !important;
    }

    .error {
      font-size: 0.85rem;
      color: #ff6b6b;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1 id="title">Countdown Timer</h1>

  <!-- Input panel -->
  <div class="input-panel" id="inputPanel">
    <label for="deadlineInput">Enter your deadline</label>
    <input type="datetime-local" id="deadlineInput">
    <button class="btn" id="startBtn">Start Countdown</button>
    <span class="error hidden" id="errorMsg">Please select a future date &amp; time.</span>
  </div>

  <!-- Countdown display -->
  <div class="countdown hidden" id="countdown">
    <div class="unit">
      <span class="number" id="days">00</span>
      <span class="label">Days</span>
    </div>
    <span class="separator">:</span>
    <div class="unit">
      <span class="number" id="hours">00</span>
      <span class="label">Hours</span>
    </div>
    <span class="separator">:</span>
    <div class="unit">
      <span class="number" id="minutes">00</span>
      <span class="label">Minutes</span>
    </div>
    <span class="separator">:</span>
    <div class="unit">
      <span class="number" id="seconds">00</span>
      <span class="label">Seconds</span>
    </div>
  </div>

  <button class="btn btn-reset hidden" id="resetBtn">Set New Deadline</button>

  <script>
    const STORAGE_KEY = 'countdown_deadline';

    // DOM refs
    const titleEl        = document.getElementById('title');
    const inputPanel     = document.getElementById('inputPanel');
    const deadlineInput  = document.getElementById('deadlineInput');
    const startBtn       = document.getElementById('startBtn');
    const errorMsg       = document.getElementById('errorMsg');
    const countdownEl    = document.getElementById('countdown');
    const resetBtn       = document.getElementById('resetBtn');
    let daysEl         = document.getElementById('days');
    let hoursEl        = document.getElementById('hours');
    let minutesEl      = document.getElementById('minutes');
    let secondsEl      = document.getElementById('seconds');

    let target = null;
    let timerId = null;
    const fmt = new Intl.DateTimeFormat('en-US', {
      month: 'long', day: 'numeric', year: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function tick() {
      const diff = target.getTime() - Date.now();

      if (diff <= 0) {
        countdownEl.innerHTML = '<span class="expired">Time&#39;s up!</span>';
        clearInterval(timerId);
        timerId = null;
        return;
      }

      const days    = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours   = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      daysEl.textContent    = pad(days);
      hoursEl.textContent   = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    function startCountdown(deadlineStr) {
      target = new Date(deadlineStr);

      // Restore the countdown innerHTML in case it was replaced by "Time's up!"
      countdownEl.innerHTML =
        '<div class="unit">' +
          '<span class="number" id="days">00</span>' +
          '<span class="label">Days</span>' +
        '</div>' +
        '<span class="separator">:</span>' +
        '<div class="unit">' +
          '<span class="number" id="hours">00</span>' +
          '<span class="label">Hours</span>' +
        '</div>' +
        '<span class="separator">:</span>' +
        '<div class="unit">' +
          '<span class="number" id="minutes">00</span>' +
          '<span class="label">Minutes</span>' +
        '</div>' +
        '<span class="separator">:</span>' +
        '<div class="unit">' +
          '<span class="number" id="seconds">00</span>' +
          '<span class="label">Seconds</span>' +
        '</div>';

      // Re-query elements after innerHTML replacement (old refs are stale)
      daysEl    = document.getElementById('days');
      hoursEl   = document.getElementById('hours');
      minutesEl = document.getElementById('minutes');
      secondsEl = document.getElementById('seconds');

      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }

      titleEl.textContent = 'Countdown to ' + fmt.format(target);

      inputPanel.classList.add('hidden');
      countdownEl.classList.remove('hidden');
      resetBtn.classList.remove('hidden');

      // If already expired, show it immediately
      if (target.getTime() - Date.now() <= 0) {
        countdownEl.innerHTML = '<span class="expired">Time&#39;s up!</span>';
        return;
      }

      tick();
      timerId = setInterval(tick, 1000);
    }

    function showInputPanel() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      target = null;
      localStorage.removeItem(STORAGE_KEY);

      inputPanel.classList.remove('hidden');
      countdownEl.classList.add('hidden');
      resetBtn.classList.add('hidden');
      errorMsg.classList.add('hidden');
      titleEl.textContent = 'Countdown Timer';
    }

    // --- Event listeners ---

    startBtn.addEventListener('click', function () {
      const val = deadlineInput.value;
      if (!val) {
        errorMsg.textContent = 'Please select a date & time.';
        errorMsg.classList.remove('hidden');
        return;
      }
      const chosen = new Date(val);
      if (chosen.getTime() <= Date.now()) {
        errorMsg.textContent = 'Please select a future date & time.';
        errorMsg.classList.remove('hidden');
        return;
      }
      errorMsg.classList.add('hidden');
      localStorage.setItem(STORAGE_KEY, val);
      startCountdown(val);
    });

    deadlineInput.addEventListener('input', function () {
      errorMsg.classList.add('hidden');
    });

    resetBtn.addEventListener('click', showInputPanel);

    // --- Restore saved deadline on load ---
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const d = new Date(saved);
      if (!isNaN(d.getTime()) && d.getTime() > Date.now()) {
        startCountdown(saved);
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    }
  </script>
</body>
</html>
