<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-Year Countdown</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 3rem;
      opacity: 0.7;
    }

    .countdown {
      display: flex;
      gap: 2.5rem;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .number {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 700;
      line-height: 1;
      min-width: 2ch;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .label {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .separator {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 700;
      line-height: 1;
      opacity: 0.3;
      align-self: flex-start;
      padding-top: 0;
    }

    .expired {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1 id="title">1 Year Countdown</h1>
  <div class="countdown" id="countdown">
    <div class="unit">
      <span class="number" id="days">00</span>
      <span class="label">Days</span>
    </div>
    <span class="separator">:</span>
    <div class="unit">
      <span class="number" id="hours">00</span>
      <span class="label">Hours</span>
    </div>
    <span class="separator">:</span>
    <div class="unit">
      <span class="number" id="minutes">00</span>
      <span class="label">Minutes</span>
    </div>
    <span class="separator">:</span>
    <div class="unit">
      <span class="number" id="seconds">00</span>
      <span class="label">Seconds</span>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'countdown_first_opened';

    let firstOpened = localStorage.getItem(STORAGE_KEY);
    if (!firstOpened) {
      firstOpened = Date.now().toString();
      localStorage.setItem(STORAGE_KEY, firstOpened);
    }

    const firstOpenedDate = new Date(parseInt(firstOpened, 10));
    const target = new Date(firstOpenedDate);
    target.setFullYear(target.getFullYear() + 1);

    const fmt = new Intl.DateTimeFormat('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    document.getElementById('title').textContent = 'Countdown to ' + fmt.format(target);

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function tick() {
      const now = Date.now();
      const diff = target.getTime() - now;

      if (diff <= 0) {
        document.getElementById('countdown').innerHTML =
          '<span class="expired">1 year reached!</span>';
        return;
      }

      const days    = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours   = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').textContent    = pad(days);
      document.getElementById('hours').textContent   = pad(hours);
      document.getElementById('minutes').textContent = pad(minutes);
      document.getElementById('seconds').textContent = pad(seconds);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
